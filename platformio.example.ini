; Copy this file to `platformio.local.ini` (gitignored via *.local*) and fill in
; your own values. PlatformIO merges it on top of `platformio.ini` automatically
; via the `extra_configs = platformio.local.ini` directive.
;
; After flashing once with bootstrap creds set, the device persists them to the
; SD card via WifiCredentialStore. You can then remove the flags from your
; local file (or leave them — the bootstrap block in main.cpp is a no-op once
; the store is non-empty).
;
; IMPORTANT: because we redefine `build_flags` here, we must include
; `${base.build_flags}` + the two debug flags from the main `[env:default]`
; block, otherwise we drop the core ARDUINO_USB_MODE / EINK_DISPLAY_SINGLE_
; BUFFER_MODE / PNG_MAX_BUFFERED_PIXELS / language defines and the build fails.

[env:default]
build_flags =
    ${base.build_flags}
    -DENABLE_SERIAL_LOG
    -DLOG_LEVEL=2
    -D TRMNL_BOOTSTRAP_WIFI_SSID=\"YOUR_SSID\"
    -D TRMNL_BOOTSTRAP_WIFI_PASSWORD=\"YOUR_PASSWORD\"
    ; Optional overrides. Leave empty in production — the captive portal
    ; and /api/setup flow populate these at first boot.
    ; -D TRMNL_DEFAULT_SERVER_URL=\"https://your-byos-host\"
    ; -D TRMNL_DEFAULT_API_KEY=\"pre-provisioned-device-key\"
    ; -D TRMNL_DEVICE_MODEL=\"byod\"
    ; -D TRMNL_FIRMWARE_VERSION=\"0.1.0\"

; Optional: upload/monitor overrides for your specific port
; upload_port = /dev/cu.usbmodem1101
; monitor_port = /dev/cu.usbmodem1101
; monitor_speed = 115200
